services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: service_b
      POSTGRES_USER: service_b
      POSTGRES_PASSWORD: service_b_local
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U service_b -d service_b"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
